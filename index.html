<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16302b;--mut:#5d6f6b;--line:#d5dcda;--acc:#0f6b5c;--acc2:#e8f1ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;padding-bottom:40px}
header{background:var(--ink);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
header small{color:#a9c2bc}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:900px;margin:auto}
nav button{flex:1;padding:10px;border:1px solid var(--line);border-bottom:0;background:var(--acc2);color:var(--mut);font:inherit;border-radius:8px 8px 0 0}
nav button.on{background:var(--card);color:var(--ink);font-weight:600}
main{max-width:900px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:0 0 10px 10px;padding:14px;margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>label{flex:1 1 140px;font-size:13px;color:var(--mut)}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:70px}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 14px;font:inherit;cursor:pointer}
button.s{background:var(--acc2);color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.it{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.it .d{flex:1;min-width:0}.it b{font-weight:600}
.it .m{color:var(--mut);font-size:13px}
.pr{text-align:right;white-space:nowrap}.pr strong{font-size:17px;color:var(--acc)}
.q{width:70px}
h2{font-size:16px;margin:18px 0 8px}
#msg{padding:10px 16px;color:#8a2b1d;max-width:900px;margin:auto}
iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:6px;margin-top:10px}
.tot{text-align:right;margin-top:10px}.tot div{margin:2px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Cotizador</h1><small id="est">Cargando Excel...</small></header>
<div id="msg"></div>
<nav><button id="t1" class="on" onclick="tab(1)">Consulta</button><button id="t2" onclick="tab(2)">Cotización (<span id="cnt">0</span>)</button></nav>
<main>
<div class="row">
<label>Margen sobre venta (%)<input id="mg" type="number" value="25" min="0" max="95" step="0.5" oninput="draw()"></label>
<label>Flete unitario costo<input id="fl" type="number" value="0" min="0" oninput="draw()"></label>
</div>

<section id="v1">
<input id="q" type="search" placeholder="Buscar por código, nombre o descripción" oninput="draw()">
<div id="res"></div>
</section>

<section id="v2" hidden>
<h2>Cliente</h2>
<div class="row">
<label>Nombre<input id="c_n"></label><label>RUT<input id="c_r"></label>
<label>Dirección<input id="c_d"></label><label>Contacto<input id="c_c"></label>
</div>
<h2>Ejecutivo de ventas</h2>
<div class="row">
<label>Nombre<input id="e_n"></label><label>Correo<input id="e_m"></label><label>Teléfono<input id="e_t"></label>
</div>
<h2>Ítems</h2>
<div id="items"></div>
<div class="row" style="margin-top:12px">
<label>Descripción ítem manual<input id="m_d"></label>
<label>Precio unitario<input id="m_p" type="number" min="0"></label>
<label>Cantidad<input id="m_q" type="number" value="1" min="1"></label>
<label style="flex:0 0 auto;align-self:flex-end"><button class="s" onclick="addManual()">Agregar ítem</button></label>
</div>
<div class="tot" id="tot"></div>
<h2>Nota legal</h2>
<textarea id="nota"></textarea>
<div class="row" style="margin-top:10px">
<label>Disposición<select id="al"><option value="left">Izquierda</option><option value="center">Centrado</option></select></label>
</div>
<button class="p" onclick="preview()">Previsualizar</button>
<button class="p" onclick="pdf(true)">Descargar PDF</button>
<div id="pv" hidden><iframe id="fr"></iframe><p><a id="ab" target="_blank">Abrir PDF en pestaña nueva</a></p></div>
</section>
</main>

<script>
const ARCHIVO = "EXPORT.XLSX";
// Palabras clave para detectar columnas del Excel (se compara sin tildes ni mayúsculas)
const COLS = {
  code:["codigo","cod","sku","ref"],
  desc:["descrip","nombre","producto","detalle"],
  cost:["costo","cost","precio"],
  stock:["stock","existencia","saldo","disponible"]
};
let P=[], Q=[];
const $=id=>document.getElementById(id);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL");
function num(v){
  if(typeof v==="number")return v;
  let s=String(v||"").replace(/[^\d.,-]/g,"");
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))s=s.replace(",",".");
  return parseFloat(s)||0;
}
const M=()=>Math.min(95,Math.max(0,+$("mg").value||0))/100;
const venta=c=>c/(1-M());
const fleteU=()=>(+$("fl").value||0)/(1-M());

async function cargar(){
  try{
    const r=await fetch(ARCHIVO+"?t="+Date.now());
    if(!r.ok)throw new Error("No se encontró "+ARCHIVO+" en el repositorio");
    const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length)throw new Error("El Excel no tiene filas");
    const heads=Object.keys(rows[0]), map={};
    for(const k in COLS){
      for(const w of COLS[k]){
        const h=heads.find(h=>norm(h).includes(w));
        if(h){map[k]=h;break}
      }
    }
    if(!map.code||!map.desc||!map.cost)throw new Error("No pude identificar las columnas. Encabezados encontrados: "+heads.join(", ")+". Ajusta COLS en index.html.");
    P=rows.map(r=>({code:String(r[map.code]),desc:String(r[map.desc]),cost:num(r[map.cost]),stock:map.stock?r[map.stock]:""})).filter(p=>p.code||p.desc);
    $("est").textContent=P.length+" productos cargados";
    draw();
  }catch(e){$("msg").textContent=e.message;$("est").textContent="Sin datos"}
}

function tab(n){
  $("v1").hidden=n!=1;$("v2").hidden=n!=2;
  $("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";
  draw();
}

function draw(){
  const t=norm($("q").value);
  const l=t?P.filter(p=>norm(p.code+" "+p.desc).includes(t)).slice(0,40):[];
  $("res").innerHTML=!t?'<p class="m">Escribe para buscar.</p>':l.length?l.map(p=>{
    const i=P.indexOf(p);
    return `<div class="it"><div class="d"><b>${esc(p.code)}</b><br>${esc(p.desc)}<div class="m">Costo ${clp(p.cost)} · Stock ${esc(p.stock)}</div></div>
    <div class="pr"><strong>${clp(venta(p.cost))}</strong><br><button class="s" onclick="add(${i})">Agregar</button></div></div>`}).join(""):'<p class="m">Sin resultados.</p>';
  items();
}

function add(i){
  const p=P[i],x=Q.find(q=>q.src===i);
  if(x)x.qty++;else Q.push({src:i,code:p.code,desc:p.desc,cost:p.cost,qty:1});
  items();
}
function addManual(){
  const d=$("m_d").value.trim(),pr=+$("m_p").value,q=+$("m_q").value||1;
  if(!d||!pr)return;
  Q.push({src:-1,code:"",desc:d,fixed:pr,qty:q});
  $("m_d").value="";$("m_p").value="";items();
}
const pu=q=>q.fixed!==undefined?q.fixed:venta(q.cost);
function items(){
  $("cnt").textContent=Q.length;
  $("items").innerHTML=Q.length?Q.map((q,i)=>`<div class="it"><div class="d"><b>${esc(q.code)}</b> ${esc(q.desc)}<div class="m">${clp(pu(q))} c/u</div></div>
  <input class="q" type="number" min="1" value="${q.qty}" onchange="Q[${i}].qty=Math.max(1,+this.value||1);items()">
  <button class="s" onclick="Q.splice(${i},1);items()">Quitar</button></div>`).join(""):'<p class="m">Sin ítems. Agrégalos desde Consulta o manualmente.</p>';
  const t=tot();
  $("tot").innerHTML=`<div>Subtotal ${clp(t.sub)}</div><div>Flete (${t.units} un. × ${clp(fleteU())}) ${clp(t.fl)}</div><div><strong>Total ${clp(t.sub+t.fl)}</strong></div>`;
}
function tot(){
  const units=Q.filter(q=>q.fixed===undefined).reduce((a,q)=>a+q.qty,0);
  return{units,sub:Q.reduce((a,q)=>a+Math.round(pu(q))*q.qty,0),fl:Math.round(fleteU())*units};
}

function pdf(save){
  const {jsPDF}=window.jspdf, d=new jsPDF(), W=210, m=15, c=$("al").value==="center";
  const X=c?W/2:m, A=c?"center":"left";
  let y=20;
  d.setFontSize(18);d.text("Cotización",X,y,{align:A});
  d.setFontSize(10);y+=7;d.text(new Date().toLocaleDateString("es-CL"),X,y,{align:A});
  const bloque=(tit,l)=>{
    y+=9;d.setFont(undefined,"bold");d.text(tit,X,y,{align:A});d.setFont(undefined,"normal");
    l.filter(Boolean).forEach(s=>{y+=5;d.text(s,X,y,{align:A})});
  };
  bloque("Cliente",[$("c_n").value,$("c_r").value&&"RUT: "+$("c_r").value,$("c_d").value,$("c_c").value]);
  bloque("Ejecutivo de ventas",[$("e_n").value,$("e_m").value,$("e_t").value]);
  const t=tot();
  const body=Q.map(q=>[q.code,q.desc,q.qty,clp(pu(q)),clp(Math.round(pu(q))*q.qty)]);
  if(t.fl)body.push(["","Flete",t.units,clp(fleteU()),clp(t.fl)]);
  d.autoTable({startY:y+8,head:[["Código","Descripción","Cant.","P. unit.","Total"]],body,
    styles:{fontSize:9},headStyles:{fillColor:[15,107,92]},
    columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}}});
  y=d.lastAutoTable.finalY+8;
  d.setFontSize(11);d.setFont(undefined,"bold");
  d.text("Total: "+clp(t.sub+t.fl),W-m,y,{align:"right"});
  d.setFont(undefined,"normal");d.setFontSize(8);
  const n=d.splitTextToSize($("nota").value,W-2*m);
  if(n.length)d.text(n,m,y+10);
  if(save){d.save("cotizacion.pdf");return}
  return d.output("bloburl");
}
function preview(){
  const u=pdf(false);
  $("fr").src=u;$("ab").href=u;$("pv").hidden=false;
}
cargar();
</script>
</body>
</html>
