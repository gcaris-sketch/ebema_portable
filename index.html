<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador Oficial EBEMA</title>
  <!-- Librerías Externas para Excel y Generación de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --ebema-red: #d32f2f;
      --ebema-red-dark: #b71c1c;
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1e293b;
      --mut: #64748b;
      --line: #cbd5e1;
      --acc-bg: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 50px;
    }
    header {
      background: var(--ink);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--ebema-red);
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 span.badge-logo {
      background: var(--ebema-red);
      color: #fff;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 900;
    }
    header small {
      color: #94a3b8;
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 6px;
      padding: 14px 14px 0;
      max-width: 1000px;
      margin: auto;
    }
    nav button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #e2e8f0;
      color: var(--mut);
      font: inherit;
      font-weight: 600;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    nav button.on {
      background: var(--card);
      color: var(--ebema-red);
      border-top: 3px solid var(--ebema-red);
    }
    main {
      max-width: 1000px;
      margin: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0 0 10px 10px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .grid-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--ebema-red);
    }
    textarea { min-height: 70px; resize: vertical; }
    
    button.btn-p {
      background: var(--ebema-red);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-p:hover { background: var(--ebema-red-dark); }
    button.btn-s {
      background: #f1f5f9;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-s:hover { background: #e2e8f0; }

    .it {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
    }
    .it:hover { background: #fff; border-color: #cbd5e1; }
    .it .d { flex: 1; min-width: 0; }
    .it b { font-weight: 700; color: var(--ink); }
    .it .m { color: var(--mut); font-size: 12px; margin-top: 2px; }
    .pr { text-align: right; white-space: nowrap; }
    .pr strong { font-size: 16px; color: var(--ebema-red); }
    .q-input { width: 80px; text-align: center; }

    h2.sec-title {
      font-size: 15px;
      color: var(--ebema-red);
      border-bottom: 2px solid #fee2e2;
      padding-bottom: 4px;
      margin: 22px 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #msg {
      padding: 10px 16px;
      background: #fef2f2;
      border-left: 4px solid var(--ebema-red);
      color: #991b1b;
      max-width: 1000px;
      margin: 10px auto 0;
      border-radius: 4px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }
    .tot-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 14px;
    }
    .tot-row.grand {
      font-size: 18px;
      font-weight: 700;
      color: var(--ebema-red);
      border-top: 2px solid var(--line);
      padding-top: 8px;
      margin-top: 6px;
    }

    iframe {
      width: 100%;
      height: 550px;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 14px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1><span class="badge-logo">EBEMA</span> Cotizador Web</h1>
  <small id="est">Cargando archivo de productos SAP...</small>
</header>

<div id="msg" hidden></div>

<nav>
  <button id="t1" class="on" onclick="tab(1)">🔍 Consulta Catálogo SAP</button>
  <button id="t2" onclick="tab(2)">📋 Cotización Actual (<span id="cnt">0</span>)</button>
</nav>

<main>
  <!-- SECCIÓN 1: BÚSQUEDA Y SELECCIÓN DE PRODUCTOS SAP -->
  <section id="v1">
    <div style="margin-bottom: 14px;">
      <input id="q" type="search" placeholder="Escribe código SAP, nombre o descripción del material..." oninput="draw()">
    </div>
    <div id="res"></div>
  </section>

  <!-- SECCIÓN 2: FORMULARIO Y EDICIÓN DE LA COTIZACIÓN -->
  <section id="v2" hidden>
    <h2 class="sec-title">Datos del Cliente</h2>
    <div class="grid-row">
      <div class="field-group"><label>Cliente / Empresa</label><input id="c_n" placeholder="Razón Social"></div>
      <div class="field-group"><label>RUT Cliente</label><input id="c_r" placeholder="12.345.678-9"></div>
      <div class="field-group"><label>Obra / Proyecto</label><input id="c_o" placeholder="Nombre de Obra"></div>
      <div class="field-group">
        <label>Condición de Pago</label>
        <select id="c_pago">
          <option value="Pagadero a 45 días">Pagadero a 45 días</option>
          <option value="Pagadero a 30 días">Pagadero a 30 días</option>
          <option value="Pagadero a 60 días">Pagadero a 60 días</option>
          <option value="Al contado">Al contado</option>
          <option value="Transferencia Anticipada">Transferencia Anticipada</option>
        </select>
      </div>
    </div>

    <h2 class="sec-title">Ejecutivo de Ventas & Emisión</h2>
    <div class="grid-row">
      <div class="field-group"><label>Ejecutivo Comercial</label><input id="e_n" value="Johanna Cuadra Martinez"></div>
      <div class="field-group"><label>Teléfono / Contacto</label><input id="e_t" placeholder="+56 9 1234 5678"></div>
      <div class="field-group"><label>N° Folio Cotización</label><input id="e_folio" value="1065321"></div>
      <div class="field-group"><label>Fecha Emisión</label><input id="e_fecha" type="date"></div>
      <div class="field-group"><label>Vigencia Hasta</label><input id="e_vigencia" type="date"></div>
    </div>

    <h2 class="sec-title">Ítems Seleccionados</h2>
    <div id="items"></div>

    <!-- AGREGAR ÍTEM MANUALMENTE -->
    <div style="background: #f8fafc; border: 1px dashed var(--line); padding: 12px; border-radius: 6px; margin-top: 14px;">
      <label style="display:block; margin-bottom:8px; color: var(--ink); font-weight:700;">+ Agregar Ítem Personalizado / Manual</label>
      <div class="grid-row" style="margin-bottom:0;">
        <div class="field-group" style="grid-column: span 2;"><label>Descripción</label><input id="m_d" placeholder="Ej: Servicio de Corte Especial"></div>
        <div class="field-group"><label>Código (Opcional)</label><input id="m_c" placeholder="MAN-001"></div>
        <div class="field-group"><label>Cant.</label><input id="m_q" type="number" value="1" min="1"></div>
        <div class="field-group"><label>U.M.</label><input id="m_u" value="UN"></div>
        <div class="field-group"><label>Precio Venta Neto ($)</label><input id="m_p" type="number" min="0" placeholder="0"></div>
      </div>
      <div style="text-align: right; margin-top: 10px;">
        <button class="btn-s" onclick="addManual()">+ Agregar Ítem Manual</button>
      </div>
    </div>

    <h2 class="sec-title">Descuentos & Flete Globales</h2>
    <div class="grid-row">
      <div class="field-group"><label>Flete Global Neto ($)</label><input id="flete_val" type="number" value="0" min="0" oninput="items()"></div>
      <div class="field-group"><label>Descuento Global Neto ($)</label><input id="desc_val" type="number" value="0" min="0" oninput="items()"></div>
    </div>

    <!-- RESUMEN FINANCIERO -->
    <div class="summary-card" id="tot"></div>

    <h2 class="sec-title">Notas / Observaciones Visibles en PDF</h2>
    <div class="field-group">
      <textarea id="nota" placeholder="Ingresa observaciones específicas sobre la entrega, condiciones técnicas o lugar de descarga..."></textarea>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn-p" onclick="preview()">👁️ Previsualizar Cotización PDF</button>
      <button class="btn-p" style="background:#15803d;" onclick="pdf(true)">📥 Descargar PDF Oficial</button>
    </div>

    <div id="pv" hidden>
      <h2 class="sec-title">Vista Previa del Documento PDF</h2>
      <iframe id="fr"></iframe>
      <p style="text-align: right;"><a id="ab" target="_blank" style="color: var(--ebema-red); font-weight: bold;">Abrir PDF en ventana completa ↗</a></p>
    </div>
  </section>
</main>

<script>
const ARCHIVO_SAP = "EXPORT.XLSX";

// MAPEO DE COLUMNAS SAP (Detección flexible sin tildes ni mayúsculas)
const COLS_SAP = {
  code: ["codigo", "cod", "sku", "ref", "articulo", "itemcode", "n° articulo", "no. articulo", "material"],
  desc: ["descrip", "nombre", "producto", "detalle", "dscription", "itemname", "maktx", "texto"],
  price: ["precio", "p.venta", "p.unitario", "price", "costo", "cost", "p.unit", "vprsv", "valor"],
  stock: ["stock", "existencia", "saldo", "disponible", "onhand", "cant", "labst"],
  um: ["um", "unidad", "medida", "meins", "unit"]
};

let P = [], Q = [];
const $ = id => document.getElementById(id);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clp = n => "$ " + Math.round(n || 0).toLocaleString("es-CL");

function num(v) {
  if (typeof v === "number") return v;
  let s = String(v || "").replace(/[^\d.,-]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  return parseFloat(s) || 0;
}

// Inicialización de Fechas Predeterminadas (Hoy y Vigencia a 7 días)
window.addEventListener("DOMContentLoaded", () => {
  const hoy = new Date();
  $("e_fecha").value = hoy.toISOString().split('T')[0];
  
  const vig = new Date();
  vig.setDate(hoy.getDate() + 7);
  $("e_vigencia").value = vig.toISOString().split('T')[0];
  
  cargarExcelSAP();
});

async function cargarExcelSAP() {
  try {
    const r = await fetch(ARCHIVO_SAP + "?t=" + Date.now());
    if (!r.ok) throw new Error("No se encontró el archivo " + ARCHIVO_SAP + " en el servidor.");
    const wb = XLSX.read(await r.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    if (!rows.length) throw new Error("El archivo Excel SAP está vacío.");

    const heads = Object.keys(rows[0]);
    const map = {};

    for (const k in COLS_SAP) {
      for (const w of COLS_SAP[k]) {
        const h = heads.find(h => norm(h).includes(w));
        if (h) { map[k] = h; break; }
      }
    }

    if (!map.code || !map.desc || !map.price) {
      throw new Error("No se detectaron las columnas obligatorias en SAP. Encabezados hallados: " + heads.join(", "));
    }

    P = rows.map(r => ({
      code: String(r[map.code] || "").trim(),
      desc: String(r[map.desc] || "").trim(),
      price: num(r[map.price]),
      stock: map.stock ? String(r[map.stock]) : "Disponible",
      um: map.um ? String(r[map.um]).toUpperCase() : "UN"
    })).filter(p => p.code || p.desc);

    $("est").textContent = P.length + " productos cargados desde SAP";
    draw();
  } catch (e) {
    const m = $("msg");
    m.hidden = false;
    m.textContent = "Aviso: " + e.message;
    $("est").textContent = "Catálogo listo (Ingreso manual disponible)";
  }
}

function tab(n) {
  $("v1").hidden = n != 1;
  $("v2").hidden = n != 2;
  $("t1").className = n == 1 ? "on" : "";
  $("t2").className = n == 2 ? "on" : "";
  draw();
}

function draw() {
  const t = norm($("q").value);
  const l = t ? P.filter(p => norm(p.code + " " + p.desc).includes(t)).slice(0, 40) : [];
  
  $("res").innerHTML = !t 
    ? '<p style="color:var(--mut); font-size:13px; text-align:center; padding:20px;">Escribe en la barra de búsqueda para explorar el catálogo de materiales SAP.</p>' 
    : l.length 
      ? l.map(p => {
          const i = P.indexOf(p);
          return `<div class="it">
            <div class="d">
              <b>${esc(p.code)}</b> — ${esc(p.desc)}
              <div class="m">Stock: ${esc(p.stock)} · U.M.: ${esc(p.um)}</div>
            </div>
            <div class="pr">
              <strong>${clp(p.price)} Neto</strong><br>
              <button class="btn-s" style="margin-top:4px;" onclick="add(${i})">+ Agregar</button>
            </div>
          </div>`;
        }).join("")
      : '<p style="color:var(--mut); padding:10px;">No se encontraron productos coincidentes en SAP.</p>';
}

function add(i) {
  const p = P[i];
  const x = Q.find(q => q.code === p.code && q.desc === p.desc);
  if (x) {
    x.qty++;
  } else {
    Q.push({ code: p.code, desc: p.desc, price: p.price, qty: 1, um: p.um });
  }
  items();
}

function addManual() {
  const d = $("m_d").value.trim();
  const c = $("m_c").value.trim();
  const pr = +$("m_p").value || 0;
  const q = +$("m_q").value || 1;
  const u = $("m_u").value.trim() || "UN";

  if (!d) {
    alert("Por favor ingresa una descripción para el ítem manual.");
    return;
  }

  Q.push({ code: c, desc: d, price: pr, qty: q, um: u });
  $("m_d").value = "";
  $("m_c").value = "";
  $("m_p").value = "";
  $("m_q").value = "1";
  items();
}

function items() {
  $("cnt").textContent = Q.length;
  
  $("items").innerHTML = Q.length 
    ? Q.map((q, i) => `
      <div class="it">
        <div class="d">
          <b>${q.code ? esc(q.code) + " — " : ""}${esc(q.desc)}</b>
          <div class="m">Precio Venta Neto: ${clp(q.price)} / ${esc(q.um)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <input class="q-input" type="number" min="1" value="${q.qty}" onchange="Q[${i}].qty = Math.max(1, +this.value||1); items()">
          <span style="font-size:12px; color:var(--mut);">${esc(q.um)}</span>
          <span style="min-width:90px; text-align:right; font-weight:700;">${clp(q.price * q.qty)}</span>
          <button class="btn-s" style="color:#b71c1c;" onclick="Q.splice(${i},1); items()">✕</button>
        </div>
      </div>`).join("")
    : '<p style="color:var(--mut); font-size:13px;">No hay ítems en la cotización. Agrégalos desde el catálogo SAP o añade un ítem manual.</p>';

  const t = tot();
  
  $("tot").innerHTML = `
    <div class="tot-row"><span>SUB TOTAL:</span> <strong>${clp(t.sub)}</strong></div>
    <div class="tot-row"><span>% DESCUENTO:</span> <strong>${clp(t.desc)}</strong></div>
    <div class="tot-row"><span>FLETE:</span> <strong>${clp(t.flete)}</strong></div>
    <div class="tot-row" style="border-top:1px solid var(--line); padding-top:4px;"><span>NETO:</span> <strong>${clp(t.neto)}</strong></div>
    <div class="tot-row"><span>I.V.A (19%):</span> <strong>${clp(t.iva)}</strong></div>
    <div class="tot-row grand"><span>TOTAL:</span> <span>${clp(t.total)}</span></div>
  `;
}

function tot() {
  const sub = Q.reduce((a, q) => a + (q.price * q.qty), 0);
  const flete = +$("flete_val").value || 0;
  const desc = +$("desc_val").value || 0;
  const neto = Math.max(0, sub - desc + flete);
  const iva = neto * 0.19;
  const total = neto + iva;
  return { sub, desc, flete, neto, iva, total };
}

// GENERACIÓN DE PDF CON FORMATO OFICIAL EBEMA
function pdf(save) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  
  const W = 210;
  const margin = 12;
  let y = 10;

  // 1. DIBUJAR ENCABEZADO OFICIAL EBEMA
  // Título Principal
  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(30, 30, 30);
  doc.text("COTIZACIÓN", W / 2, y + 6, { align: "center" });

  // Logo Vectorial de EBEMA (Círculo Rojo + Texto)
  doc.setDrawColor(211, 47, 47);
  doc.setLineWidth(1.2);
  doc.circle(185, y + 5, 8.5, 'S');
  doc.setFontSize(7.5);
  doc.setTextColor(211, 47, 47);
  doc.text("EBEMA", 185, y + 6, { align: "center" });

  // Subencabezado de Razón Social
  doc.setFontSize(8);
  doc.setFont("helvetica", "bold");
  doc.setTextColor(50, 50, 50);
  doc.text("EBEMA S.A. Giro: Distribución de Materiales de Construcción RUT: 83.585.400-0", W / 2, y + 12, { align: "center" });
  
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7.5);
  doc.text("Casa Matriz: Galvarino 8501, Quilicura - Santiago Fono:(2) 654 4400", W / 2, y + 16, { align: "center" });

  // Folio y Fecha Superior
  const fechaE = $("e_fecha").value ? $("e_fecha").value.split('-').reverse().join('-') : new Date().toLocaleDateString("es-CL");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text("Fecha " + fechaE, margin, y + 16);
  doc.text("N° " + ($("e_folio").value || "1065321"), 198, y + 16, { align: "right" });

  // Línea divisoria superior
  y += 19;
  doc.setDrawColor(80, 80, 80);
  doc.setLineWidth(0.4);
  doc.line(margin, y, W - margin, y);

  // BARRA DE SUCURSALES EBEMA
  y += 3;
  doc.setFontSize(6);
  const sucursales = [
    { n: "Sucursal Antofagasta", d: "Pedro Aguirre Cerda 11662", t: "(55) 480 100", c: "Antofagasta" },
    { n: "Sucursal La Serena", d: "Los Talleres 1930", t: "(51) 556 155", c: "Coquimbo" },
    { n: "Sucursal La Calera", d: "Aldunate 480-B", t: "(33) 221 111", c: "La Calera" },
    { n: "Sucursal San Fernando", d: "Chillán 761", t: "(72) 583 970", c: "San Fernando" },
    { n: "Sucursal Talca", d: "KM 258, 6 Caletera O.", t: "(73) 2634240", c: "Talca" },
    { n: "Sucursal Concepción", d: "Av. Gen. Bonilla 2098", t: "(41) 288 5850", c: "Concepción" },
    { n: "Sucursal Temuco", d: "Reyes Católicos 01550", t: "(45) 911 640", c: "Temuco" },
    { n: "Sucursal Puerto Montt", d: "Calle Puerto Lirquén S/N", t: "(65) 238 3930", c: "Puerto Montt" }
  ];

  const colW = (W - 2 * margin) / sucursales.length;
  sucursales.forEach((s, idx) => {
    const x = margin + (idx * colW);
    doc.setFont("helvetica", "bold");
    doc.text(s.n, x, y);
    doc.setFont("helvetica", "normal");
    doc.text(s.d, x, y + 3);
    doc.text("Teléfono: " + s.t, x, y + 6);
    doc.text(s.c, x, y + 9);
  });

  y += 11;
  doc.line(margin, y, W - margin, y);

  // 2. DATOS DEL CLIENTE Y PROYECTO
  y += 4;
  doc.setFontSize(8);
  
  doc.setFont("helvetica", "bold"); doc.text("SR(ES):", margin, y);
  doc.setFont("helvetica", "normal"); doc.text(($("c_n").value || "").toUpperCase(), margin + 15, y);
  
  doc.setFont("helvetica", "bold"); doc.text("RUT:", 135, y);
  doc.setFont("helvetica", "normal"); doc.text($("c_r").value || "", 145, y);

  y += 4;
  doc.setFont("helvetica", "bold"); doc.text("OBRA:", margin, y);
  doc.setFont("helvetica", "normal"); doc.text(($("c_o").value || "-").toUpperCase(), margin + 15, y);

  // 3. TABLA DE ÍTEMS COTIZADOS
  const tableBody = Q.map(q => [
    q.code || "-",
    q.desc,
    q.qty.toLocaleString("es-CL"),
    q.um,
    Math.round(q.price).toLocaleString("es-CL"),
    Math.round(q.price * q.qty).toLocaleString("es-CL")
  ]);

  doc.autoTable({
    startY: y + 3,
    margin: { left: margin, right: margin },
    head: [["Código", "Descripción", "Cantidad", "U.M.", "P. Unitario", "Total Neto"]],
    body: tableBody,
    theme: "plain",
    styles: { fontSize: 8, cellPadding: 1.5, lineColor: [0, 0, 0], lineWidth: 0.1 },
    headStyles: { fontStyle: "bold", fillColor: [240, 240, 240], textColor: [0, 0, 0] },
    columnStyles: {
      0: { cellWidth: 25 },
      1: { cellWidth: "auto" },
      2: { halign: "right", cellWidth: 18 },
      3: { halign: "center", cellWidth: 15 },
      4: { halign: "right", cellWidth: 25 },
      5: { halign: "right", cellWidth: 28 }
    }
  });

  y = doc.lastAutoTable.finalY + 2;

  // 4. SECCIÓN INFERIOR: CONDICIONES Y TABLA DE TOTALES (FORMATO EXACTO CAPTURA)
  const t = tot();
  const fechaVig = $("e_vigencia").value ? $("e_vigencia").value : "";

  // Dibujar contenedor principal del pie de totales
  const pieH = 26;
  doc.setLineWidth(0.3);
  doc.rect(margin, y, W - 2 * margin, pieH);
  
  // Divisor vertical entre CONDICIONES y TOTALES FINANCIEROS
  const splitX = 135;
  doc.line(splitX, y, splitX, y + pieH);

  // --- BLOQUE IZQUIERDO: CONDICIONES ---
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8);
  doc.text("CONDICIONES", margin + 2, y + 4);

  doc.setFont("helvetica", "normal");
  doc.text("Vigencia hasta: " + fechaVig, margin + 2, y + 10);
  
  const condPago = $("c_pago").value;
  doc.text("Condiciones de", margin + 2, y + 15);
  doc.text("venta: " + condPago, margin + 2, y + 19);

  // --- BLOQUE DERECHO: DESGLOSE FINANCIERO ---
  const rx = W - margin - 2;
  let ty = y + 4;
  doc.setFontSize(7.5);

  const printTotRow = (lbl, val) => {
    doc.setFont("helvetica", "bold");
    doc.text(lbl, splitX + 2, ty);
    doc.text(Math.round(val).toLocaleString("es-CL"), rx, ty, { align: "right" });
    ty += 4;
  };

  printTotRow("SUB TOTAL", t.sub);
  printTotRow("% DESCUENTO", t.desc);
  printTotRow("FLETE", t.flete);
  printTotRow("NETO", t.neto);
  printTotRow("I.V.A", t.iva);
  printTotRow("TOTAL", t.total);

  y += pieH;

  // CINTA HORIZONTAL: REAJUSTES
  doc.rect(margin, y, W - 2 * margin, 5);
  doc.setFontSize(7);
  doc.setFont("helvetica", "normal");
  doc.text("Reajustes:100% Alzas de Fábricas - Entregas sujetas a disponibilidad de Fábrica", W / 2, y + 3.5, { align: "center" });

  y += 5;

  // BLOQUE FINAL DE NOTAS Y FIRMA DEL VENDEDOR
  const finH = 22;
  doc.rect(margin, y, W - 2 * margin, finH);
  doc.line(95, y, 95, y + finH);

  // Notas
  doc.setFontSize(8);
  doc.setFont("helvetica", "bold");
  doc.text("Notas:", margin + 2, y + 4);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  
  const notaTxt = $("nota").value.trim();
  if (notaTxt) {
    const lines = doc.splitTextToSize(notaTxt, 75);
    doc.text(lines, margin + 2, y + 8);
  }

  // Recuadro Firma Vendedor
  const ejecNombre = $("e_n").value || "Johanna Cuadra Martinez";
  doc.line(105, y + 12, 180, y + 12); // Línea de firma
  doc.setFontSize(8);
  doc.setFont("helvetica", "normal");
  doc.text("Cotización realizada por:", 142.5, y + 16, { align: "center" });
  doc.setFont("helvetica", "bold");
  doc.text(ejecNombre, 142.5, y + 20, { align: "center" });

  if (save) {
    doc.save(`Cotizacion_EBEMA_${$("e_folio").value || "1065321"}.pdf`);
    return;
  }
  return doc.output("bloburl");
}

function preview() {
  const u = pdf(false);
  $("fr").src = u;
  $("ab").href = u;
  $("pv").hidden = false;
}
</script>
</body>
</html>
